name: Build Skleyka (macOS)
# Started by scripts/release-friends.sh in the private source repo.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег версии в kimurazver67/reacut, например v0.8.0'
        required: true
permissions:
  contents: write
concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  mac-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - name: Validate tag
        working-directory: .
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: kimurazver67/reacut
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/media-tools
            src/.media-build/downloads
          key: media-tools-${{ runner.arch }}-${{ hashFiles('src/scripts/build-media-tools.mjs', 'src/scripts/build-whisper.mjs', 'src/scripts/fetch-*.mjs', 'src/electron/faces.ts', 'src/src/core/speech.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            media-tools-${{ runner.arch }}-${{ hashFiles('src/scripts/build-media-tools.mjs', 'src/scripts/build-whisper.mjs', 'src/scripts/fetch-*.mjs', 'src/electron/faces.ts', 'src/src/core/speech.ts') }}-
            media-tools-${{ runner.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.arch }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: electron-${{ runner.arch }}-
      - run: npm ci
      # github.com/releases/download sometimes answers 504 for minutes.
      - run: for i in 1 2 3 4 5 6; do node node_modules/electron/install.js && exit 0; echo "retry $i"; sleep $((i * 20)); done; exit 1
      - run: npm run media:build
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            src/media-tools
            src/.media-build/downloads
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - run: npx vitest run --exclude '**/*.integration.test.ts'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          REACUT_FFMPEG: ${{ github.workspace }}/src/media-tools/darwin-arm64/ffmpeg
          REACUT_FFPROBE: ${{ github.workspace }}/src/media-tools/darwin-arm64/ffprobe
      - run: npm run licenses
      - run: for i in 1 2 3 4; do npm run dist:mac:installer && exit 0; echo "retry $i"; rm -rf release; sleep $((i * 30)); done; exit 1
      - name: Verify app
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          ditto -x -k "release/ReaCut-$v-arm64-mac.zip" /tmp/check
          codesign --verify --deep --strict /tmp/check/ReaCut.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /tmp/check/ReaCut.app/Contents/Info.plist)" = "$v"
      - name: Per-file update assets
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          if [ -f scripts/make-update-files.mjs ]; then node scripts/make-update-files.mjs /tmp/check/ReaCut.app release/delta "$v" arm64; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          cp LICENSE release/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          tar -czf "release/ReaCut-$v-media-tool-sources.tar.gz" -C media-tools/darwin-arm64 sources licenses manifest.json
          cd release
          cp "ReaCut-$v-arm64.dmg" ReaCut-mac.dmg; cp "ReaCut-$v-arm64.dmg" Skleyka-mac.dmg
          shasum -a 256 "ReaCut-$v-arm64.dmg" "ReaCut-$v-arm64-mac.zip" "ReaCut-$v-media-tool-sources.tar.gz" > SHA256SUMS.txt
          notes="$(git -C .. log -1 --format=%B "$TAG" 2>/dev/null || true)"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Skleyka-mac.dmg"
          notes="$(printf '### ⬇️ Скачать Склейку: [Skleyka-mac.dmg](%s) (Mac M1–M4)\nПосле установки один раз в Терминале: `xattr -cr /Applications/ReaCut.app`. Файлы blob-*.gz — для автообновления, скачивать их не нужно.\n\n%s' "$dl" "${notes:-Склейка $v}")"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Склейка $v" --notes "$notes" \
            Skleyka-mac.dmg ReaCut-mac.dmg "ReaCut-$v-arm64.dmg" "ReaCut-$v-arm64-mac.zip" "ReaCut-$v-media-tool-sources.tar.gz" LICENSE.txt THIRD_PARTY_NOTICES.md SHA256SUMS.txt
          if [ -d delta ]; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" delta/*; fi
